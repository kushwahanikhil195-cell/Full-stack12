<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
</head>
<body>
    <h1 style ="font-family: 'Courier New', Courier, monospace;">i am nikhil kushwaha</h1>
    <h2 style ="font-style: italic;">i am a student</h2>
    <h2 style ="font-weight: bold;">i am a web developer</h2>
    <h2 style = "text-decoration: line-through;">i am a web designer</h2>
    <h2 style = "text-decoration: underline red;">i am a web developer</h2>
    <h2 style = "text-decoration: overline;">i am a web designer</h2>
    <h2 style ="text-transform: uppercase;">i am a web developer</h2>
    <h2 style ="word-spacing: 20px;">i am a web developer</h2>
    <h2 style ="letter-spacing: 30px;">i am a web designer</h2>
    <h2 style ="line-height: 50px;">i am a web designer</h2>
    <h2 style ="text-align: center;">i am a web designer</h2>
</body>
</html>
