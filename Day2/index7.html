    <title>box-modeling</title>

<style>
    #container{
        
        height: 500px;
        width: 80%;
        border: 1px solid blueviolet;
        margin:auto;
        display: flex;
    } 
    #container>div{
        height: 380px;
        width: 30%;
        border: 1px solid rgb(211, 13, 46);
        display: 20px;
        margin-left: 10px;
    }  
    img{
        width: 100%;
        height: 80%;
        border: 10px;

    }
    h3{
        text-align: center;
        color: blueviolet;
        font-style: italic;
    }




</style>
<body>
    <Div id ="container">
        <div>

            <h2>Drift Car</h2>
        </div>
        <div>
            <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/remote-control-toy/j/v/7/flare-remote-control-car-4-wheel-drive-drifting-rc-2-l-o-t-cars-original-imahk32fkx2xezty.jpeg?q=70" alt="car">
            <h2>Flare Car</h2>
        </div>
        <div> 
            <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/remote-control-toy/e/u/i/1-64-formula-rc-racing-car-with-app-control-led-lights-original-imahznkyxzp8tagp.jpeg?q=70" alt="car">
